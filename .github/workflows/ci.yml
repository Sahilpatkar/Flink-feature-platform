name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flink-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f flink-jobs/pom.xml verify

  replayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: replayer/requirements-dev.txt
      - run: pip install -r replayer/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: replayer
